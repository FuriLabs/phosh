# Play video in software, because this device's hardware decoders do not work.
#
# Measured 2026-08-11 with `gst-launch-1.0 filesrc ! decodebin ! fakesink`:
#
#   droidvdec    H.264: "No valid frames decoded before end of stream", at
#                1078x2410, at 1080x2416 and at 720x1280 alike -- so it is the
#                decoder, not an odd frame size from the screen recorder.
#   v4l2vp9dec   VP9: hangs indefinitely, never producing a frame.
#
# With both ranked out of the way every file played, including the ones the
# laptop had no trouble with. HEVC already decoded fine (libde265dec /
# avdec_h265) and is left alone.
#
# The cost is CPU rather than the GPU/DSP for H.264 and VP9 playback. That is a
# real cost on a long video, but the alternative here is a decoder that returns
# nothing at all.
#
# systemd reads environment.d when the user manager starts, so this takes
# effect at the next login. It does not reach flatpak applications, which do
# not inherit the host session environment; those need a flatpak override.
GST_PLUGIN_FEATURE_RANK=droidvdec:NONE,v4l2vp9dec:NONE
